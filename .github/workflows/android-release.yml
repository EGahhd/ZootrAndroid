name: Android Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Locate APK
        run: find . -name "*.apk" -o -name "*.aab"

      - name: Check Installed Build Tools Versions
        run: |
          ls $ANDROID_HOME/build-tools/

      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/py311/release/
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zootr-debug
          path: app/build/outputs/apk/py311/debug/*.apk

      - name: Rename Signed APK
        run: |
          SIGNED_PATH="app/build/outputs/apk/py311/release/app-py311-release-unsigned-signed.apk"
          mv $SIGNED_PATH app/build/outputs/apk/py311/release/zootr-release.apk

      - name: Upload Signed Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zootr-release
          path: app/build/outputs/apk/py311/release/zootr-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ github.workspace}}/.github/release-template.md
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/py311/debug/*.apk
            app/build/outputs/apk/py311/release/zootr-release.apk
